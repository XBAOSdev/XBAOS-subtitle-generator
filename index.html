<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>XBAOS 字幕生成器</title>
    <style>
      /* 首屏底色。默认深色，这里先铺上避免启动瞬间白闪；
         与 tokens 里的 --color-bg-base 保持一致。
         毛玻璃模式下这段会被 global.css 的 html.glass 覆盖为透明 */
      html {
        background: #121212;
      }
      html[data-theme='light'] {
        background: #ededed;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) {
          background: #ededed;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
